<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convertify — a fast, beautiful, and precise unit converter. Length, mass, temperature, data, and more." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Convertify — Unit Converter</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('convertify-theme')
          var dark = stored ? stored === 'dark' : true
          var el = document.documentElement
          el.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
